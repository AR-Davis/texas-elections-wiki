name: Check for New Polls

on:
  schedule:
    # Run every 30 minutes during the day (0600-2359 UTC) for faster updates during high traffic,
    # hourly overnight (0000-0559 UTC).
    - cron: '0,30 6-23 * * *'
    - cron: '0 0-5 * * *'
  workflow_dispatch:

jobs:
  check-polls:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-html-parser

      - name: Check for new polls
        run: node scripts/check-polls.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/poll-updates.json data/poll-check-summary.json data/polls-2026.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(polls): refresh polls-2026.json + check at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Robust push with rebase retry in case another workflow committed concurrently
          for i in 1 2 3; do
            git pull --rebase
            git push && exit 0
            sleep 3
          done
          echo "Failed to push after retries" >&2
          exit 1