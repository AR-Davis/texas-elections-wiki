name: Check for New Polls

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-polls:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for new polls
        run: node scripts/check-polls.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/poll-updates.json data/poll-check-summary.json
          git diff --cached --quiet || (git commit -m "chore(polls): check at $(date -u +%Y-%m-%dT%H:%M:%SZ)" && git push)