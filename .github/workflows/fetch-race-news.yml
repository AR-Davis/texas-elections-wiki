name: Fetch Race News

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch race news
        run: node scripts/fetch-race-news.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/race-news.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(race-news): update at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Robust push with rebase retry in case another workflow committed concurrently
          for i in 1 2 3; do
            git pull --rebase
            git push && exit 0
            sleep 3
          done
          echo "Failed to push after retries" >&2
          exit 1